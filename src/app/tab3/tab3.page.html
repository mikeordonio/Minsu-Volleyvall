<ion-content [fullscreen]="true">
  <div class="about-shell">
    <img class="about-logo" src="assets/MinSU_logo.png" alt="Mindoro State University seal">
    <ion-card>
      <ion-card-header>
        <ion-icon name="trophy-outline" class="about-icon"></ion-icon>
        <ion-card-title>MinSU Volleyball Team</ion-card-title>
        <ion-card-subtitle>Mens and Womens volleyball</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <p>Meet the athletes who represent Mindoro State University on the volleyball court. The MinSU volleyball team is built on discipline, teamwork, and pride in every match.</p>
        <ion-chip color="primary"><ion-icon name="people-outline"></ion-icon><ion-label>Mens Team</ion-label></ion-chip>
        <ion-chip color="secondary"><ion-icon name="people-outline"></ion-icon><ion-label>Womens Team</ion-label></ion-chip>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
