
name: Deploy Ionic App Locally

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:

    - name: Checkout latest code 
      uses: actions/checkout@v4

    - name: Build Ionic image
      run: docker build -t minsu-volleyball:latest .

    - name: Remove previous container 
      run: docker rm -f minsu-volleball
      continue-on-error: true

    - name: Start updated container
      run: docker run -d --name minsu-volleyball-container --restart unless-stopped -p 8100:8100 minsu-volleyball
      
    - name: Verify app
      shell: powershell
      run: |
        $success = $false
        for ($i = 1; $i -le 15; $i++) {
          try {
            Invoke-WebRequest http://localhost:8100/ -UseBasicParsing -TimeoutSec 2 | Out-Null
            $success = $true
            break
          } catch {
            Start-Sleep -Seconds 2
          }
        }
        if (-not $success) {
          docker logs minsu-volleball 
          exit 1
        }